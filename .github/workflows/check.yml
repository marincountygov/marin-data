name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: git fetch --no-tags --depth=1 origin main
      - run: bash scripts/check.sh

  # Checks the JSON-LD against the schemaGov validators. schemaGov is pinned to the commit this was last
  # checked with, so a later change to schemaGov cannot turn this red. To move to a newer one, change the
  # ref, run the check, and fix or list anything new (see check_schemagov.py).
  schemagov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: govfresh/schemaGov
          ref: 3061e7515b71fa79109a6541ffd03c188a2134f3
          path: schemaGov
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements-schemagov.txt
      - run: python3 check_schemagov.py schemaGov
